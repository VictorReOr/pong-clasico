<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>El Clásico — Pong Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --papel:#F2E8D5;
    --papel-osc:#E7D9BC;
    --tinta:#1A1712;
    --rojo:#C23B22;
    --verde:#2B4A31;
    --verde-osc:#1D3423;
    --ocre:#D9A441;
    --azul:#2B4570;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:var(--papel);
    color:var(--tinta);
    font-family:'Barlow Condensed', sans-serif;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  /* textura de papel envejecido */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1000;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;
    animation:grano 1s steps(3) infinite;
  }
  @keyframes grano{ 0%,100%{opacity:.05;} 50%{opacity:.09;} }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:999;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(26,23,18,.18) 100%);
  }
 
  #wrap{ width:100%; max-width:940px; padding:16px; position:relative; z-index:1; }
 
  #cabecera{ position:relative; text-align:center; margin-bottom:8px; }
  #sunburst{
    position:absolute; top:50%; left:50%; width:340px; height:340px;
    transform:translate(-50%,-58%);
    background:repeating-conic-gradient(from 0deg, var(--ocre) 0deg 8deg, transparent 8deg 20deg);
    border-radius:50%; opacity:.16; filter:blur(.3px);
    animation:girar 140s linear infinite;
    pointer-events:none;
  }
  @keyframes girar{ to{ transform:translate(-50%,-58%) rotate(360deg); } }
  #eyebrow{
    font-family:'Special Elite', monospace; font-size:12px; letter-spacing:3px;
    text-transform:uppercase; color:var(--rojo); position:relative;
  }
  #titulo{
    font-family:'Anton', sans-serif; font-weight:400;
    text-align:center; text-transform:uppercase;
    font-size:clamp(22px,4.6vw,40px);
    letter-spacing:.5px; margin:2px 0 8px 0; position:relative;
    text-shadow:2px 2px 0 rgba(26,23,18,.12);
  }
 
  #marcador{
    position:relative;
    display:flex; align-items:center; justify-content:center; gap:0;
    background:var(--tinta); border:3px solid var(--tinta); border-radius:2px;
    padding:12px 0; margin-bottom:12px;
    box-shadow:5px 5px 0 rgba(26,23,18,.15);
  }
  #marcador::before, #marcador::after{
    content:""; position:absolute; top:50%; width:14px; height:14px; border-radius:50%;
    background:var(--papel); transform:translateY(-50%);
  }
  #marcador::before{ left:-7px; }
  #marcador::after{ right:-7px; }
  .equipo{ flex:1; text-align:center; }
  .equipo .nombre{
    font-family:'Special Elite', monospace;
    font-size:clamp(10px,1.7vw,13px); letter-spacing:2px;
    text-transform:uppercase; color:var(--papel-osc); opacity:.85;
  }
  .equipo .num{
    font-family:'Anton', sans-serif; color:var(--papel);
    font-size:clamp(38px,6.8vw,56px); line-height:1;
  }
  #vs{
    font-family:'Anton', sans-serif;
    font-size:clamp(12px,2vw,16px);
    color:var(--ocre); padding:0 18px; text-align:center; letter-spacing:1px;
  }
  #estadoConexion{ font-family:'Special Elite',monospace; font-size:10px; color:var(--papel-osc); opacity:.7; letter-spacing:.5px; margin-top:3px; }
 
  /* barra de energía del supertiro */
  .barra-energia{
    width:70%; max-width:92px; height:7px; margin:7px auto 0;
    background:rgba(242,232,213,.15);
    border:1.5px solid rgba(242,232,213,.35);
    border-radius:4px; overflow:hidden;
  }
  .barra-fill{
    height:100%; width:0%;
    background:var(--ocre);
    transition:width .25s ease, background-color .25s ease;
  }
  .barra-fill.lista{
    background:var(--rojo);
    animation:pulso-carga .65s ease-in-out infinite;
  }
  @keyframes pulso-carga{ 0%,100%{opacity:1;} 50%{opacity:.5;} }
 
  #cancha{
    display:block; width:100%; aspect-ratio:16/10;
    border:4px solid var(--tinta); border-radius:2px;
    box-shadow:6px 6px 0 rgba(26,23,18,.15);
  }
  #pie{
    display:flex; justify-content:space-between; margin-top:10px;
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:.6px; text-transform:uppercase; opacity:.75; flex-wrap:wrap; gap:6px;
  }
  #cancha-cont{ position:relative; }
 
  #overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:var(--papel);
    border:3px dashed var(--tinta); border-radius:2px;
    text-align:center; gap:12px; color:var(--tinta);
    padding:26px 20px; overflow-y:auto;
  }
  #overlay::before, #overlay::after{
    content:""; position:absolute; top:-11px; width:20px; height:20px; border-radius:50%;
    background:var(--verde-osc); border:3px solid var(--tinta);
  }
  #overlay::before{ left:14px; }
  #overlay::after{ right:14px; }
  #overlay h2{
    font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(20px,4.2vw,34px); margin:0; letter-spacing:.5px;
  }
  #overlay p{ margin:0; font-size:15px; opacity:.75; max-width:480px; }
  .oculto{ display:none !important; }
 
  .btn{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:15px;
    letter-spacing:1px; text-transform:uppercase; background:var(--rojo); color:var(--papel);
    border:2px solid var(--tinta); padding:11px 22px; border-radius:2px; cursor:pointer;
    box-shadow:3px 3px 0 var(--tinta); transition:transform .08s ease;
  }
  .btn:hover{ transform:translate(-1px,-1px); filter:brightness(1.05); }
  .btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--tinta); }
  .btn.secundario{ background:transparent; color:var(--tinta); border:2px solid var(--tinta); box-shadow:3px 3px 0 rgba(26,23,18,.25); }
  .botonera{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
 
  .codigo{
    font-family:'Anton', sans-serif; font-size:clamp(28px,6vw,42px); letter-spacing:8px;
    color:var(--tinta); background:var(--papel-osc); border:3px dashed var(--rojo);
    border-radius:2px; padding:8px 22px 8px 30px;
  }
  #inputCodigo{
    font-family:'Anton', sans-serif; font-size:22px; letter-spacing:6px;
    text-align:center; text-transform:uppercase; width:190px; padding:8px; border-radius:2px;
    border:2px solid var(--tinta); background:var(--papel-osc); color:var(--tinta);
  }
  #inputCodigo:focus{ outline:none; border-color:var(--rojo); }
 
  .equipos-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px; max-width:640px; width:100%;
  }
  .equipo-chip{
    display:flex; align-items:center; gap:7px;
    font-family:'Barlow Condensed', sans-serif; font-size:13px; font-weight:600;
    letter-spacing:.3px; text-transform:uppercase; color:var(--tinta);
    background:var(--papel-osc); border:2px solid var(--tinta); border-radius:2px;
    padding:8px 8px; cursor:pointer; text-align:left;
    box-shadow:2px 2px 0 rgba(26,23,18,.2); transition:transform .08s ease;
  }
  .equipo-chip:hover{ transform:translate(-1px,-1px) rotate(-.5deg); border-color:var(--rojo); }
  .swatch{ width:12px; height:12px; border-radius:2px; flex-shrink:0; border:1px solid rgba(0,0,0,.4); }
  .bandera-emoji{ font-size:18px; line-height:1; flex-shrink:0; }
  .bandera-emoji-marcador{ font-size:15px; vertical-align:middle; margin-right:5px; }
  .bandera-emoji-titulo{ font-size:19px; vertical-align:middle; margin:0 5px; }
  .config-fila{ width:100%; max-width:480px; text-align:left; }
  .config-label{ font-family:'Special Elite',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; opacity:.7; margin-bottom:6px; }
  .segmentado{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg-btn{
    font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:13px;
    letter-spacing:.5px; text-transform:uppercase; background:var(--papel-osc); color:var(--tinta);
    border:2px solid var(--tinta); border-radius:2px; padding:7px 14px; cursor:pointer;
  }
  .seg-btn.activo{ background:var(--ocre); border-color:var(--tinta); }
</style>
</head>
<body>
<div id="wrap">
  <div id="cabecera">
    <div id="sunburst"></div>
    <div id="eyebrow">Road to mundial 2030</div>
    <h1 id="titulo">EL CLÁSICO PONG</h1>
  </div>
  <div id="marcador">
    <div class="equipo esp">
      <div class="nombre">España</div>
      <div class="num" id="scoreEsp">0</div>
      <div class="barra-energia"><div class="barra-fill" id="barraEsp"></div></div>
    </div>
    <div id="vs">FT.<div id="estadoConexion"></div></div>
    <div class="equipo arg">
      <div class="nombre">Argentina</div>
      <div class="num" id="scoreArg">0</div>
      <div class="barra-energia"><div class="barra-fill" id="barraArg"></div></div>
    </div>
  </div>
  <div id="cancha-cont">
    <canvas id="cancha" width="900" height="560"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="pie">
    <span id="pieEsp">JUGADOR 1 · WASD</span>
    <span id="pieCentro">ESPACIO = supertiro · ESC pausa</span>
    <span id="pieArg">JUGADOR 2 · FLECHAS</span>
  </div>
</div>
 
<script>
const cv = document.getElementById('cancha');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
 
const scoreEspEl = document.getElementById('scoreEsp');
const scoreArgEl = document.getElementById('scoreArg');
const barraEspEl = document.getElementById('barraEsp');
const barraArgEl = document.getElementById('barraArg');
const overlay = document.getElementById('overlay');
const estadoConexionEl = document.getElementById('estadoConexion');
const pieEsp = document.getElementById('pieEsp');
const pieArg = document.getElementById('pieArg');
const pieCentro = document.getElementById('pieCentro');
const nombreEspEl = document.querySelector('.equipo.esp .nombre');
const nombreArgEl = document.querySelector('.equipo.arg .nombre');
const numEspEl = document.querySelector('.equipo.esp .num');
const numArgEl = document.querySelector('.equipo.arg .num');
const tituloEl = document.getElementById('titulo');
 
const PALA_W = 16, BOLA_R = 13;
const VEL_PALA_MOV = 6.6;
const MARGEN_CENTRO = 18;
const TOQUES_PARA_CARGA = 5;
 
const TEAMS = [
  {id:'arg', nombre:'Argentina', cc:'ar', colores:['#6CACE4','#FFFFFF','#F6B40E']},
  {id:'bra', nombre:'Brasil', cc:'br', colores:['#009739','#FEDD00','#002776']},
  {id:'col', nombre:'Colombia', cc:'co', colores:['#FCD116','#003893','#CE1126']},
  {id:'ecu', nombre:'Ecuador', cc:'ec', colores:['#FFDD00','#034EA2','#ED1C24']},
  {id:'par', nombre:'Paraguay', cc:'py', colores:['#D52B1E','#FFFFFF','#0038A8']},
  {id:'uru', nombre:'Uruguay', cc:'uy', colores:['#75AADB','#FFFFFF','#FCD116']},
  {id:'esp', nombre:'España', cc:'es', colores:['#C60B1E','#FFC400','#C60B1E']},
  {id:'ale', nombre:'Alemania', cc:'de', colores:['#000000','#DD0000','#FFCE00']},
  {id:'fra', nombre:'Francia', cc:'fr', colores:['#0055A4','#FFFFFF','#EF4135']},
  {id:'por', nombre:'Portugal', cc:'pt', colores:['#006600','#FF0000','#FFCC00']},
  {id:'ned', nombre:'Países Bajos', cc:'nl', colores:['#FF6C00','#21468B','#FFFFFF']},
  {id:'ing', nombre:'Inglaterra', cc:'gb-eng', colores:['#FFFFFF','#CE1124','#FFFFFF']},
  {id:'bel', nombre:'Bélgica', cc:'be', colores:['#000000','#FAE042','#ED2939']},
  {id:'cro', nombre:'Croacia', cc:'hr', colores:['#FF0000','#FFFFFF','#171796']},
  {id:'sui', nombre:'Suiza', cc:'ch', colores:['#FF0000','#FFFFFF','#FF0000']},
  {id:'swe', nombre:'Suecia', cc:'se', colores:['#006AA7','#FECC02','#006AA7']},
  {id:'nor', nombre:'Noruega', cc:'no', colores:['#EF2B2D','#FFFFFF','#002868']},
  {id:'tur', nombre:'Turquía', cc:'tr', colores:['#E30A17','#FFFFFF','#E30A17']},
  {id:'mar', nombre:'Marruecos', cc:'ma', colores:['#C1272D','#006233','#C1272D']},
  {id:'sen', nombre:'Senegal', cc:'sn', colores:['#00853F','#FDEF42','#E31B23']},
  {id:'egy', nombre:'Egipto', cc:'eg', colores:['#CE1126','#FFFFFF','#000000']},
  {id:'gha', nombre:'Ghana', cc:'gh', colores:['#CE1126','#FCD116','#006B3F']},
  {id:'civ', nombre:'Costa de Marfil', cc:'ci', colores:['#F77F00','#FFFFFF','#009E60']},
  {id:'jpn', nombre:'Japón', cc:'jp', colores:['#FFFFFF','#BC002D','#FFFFFF']},
  {id:'kor', nombre:'Corea del Sur', cc:'kr', colores:['#FFFFFF','#CD2E3A','#0047A0']},
  {id:'aus', nombre:'Australia', cc:'au', colores:['#00843D','#FFCD00','#012169']},
  {id:'ksa', nombre:'Arabia Saudita', cc:'sa', colores:['#006C35','#FFFFFF','#006C35']},
  {id:'mex', nombre:'México', cc:'mx', colores:['#006847','#FFFFFF','#CE1126']},
  {id:'usa', nombre:'Estados Unidos', cc:'us', colores:['#3C3B6E','#B22234','#FFFFFF']},
  {id:'can', nombre:'Canadá', cc:'ca', colores:['#FF0000','#FFFFFF','#FF0000']},
  {id:'pan', nombre:'Panamá', cc:'pa', colores:['#D21034','#072357','#FFFFFF']},
  {id:'nzl', nombre:'Nueva Zelanda', cc:'nz', colores:['#000000','#FFFFFF','#C0C0C0']}
];
// Banderas como emoji Unicode: no requieren conexión a internet, las renderiza la fuente del sistema.
function banderaEmoji(cc){
  if(cc === 'gb-eng'){
    return String.fromCodePoint(0x1F3F4,0xE0067,0xE0062,0xE0065,0xE006E,0xE0067,0xE007F);
  }
  return cc.toUpperCase().split('').map(ch=> String.fromCodePoint(127397 + ch.charCodeAt(0))).join('');
}
 
const DIFICULTADES_CPU = {
  facil:   { vel: VEL_PALA_MOV*0.42, error: 52, nombre:'Fácil' },
  normal:  { vel: VEL_PALA_MOV*0.70, error: 24, nombre:'Normal' },
  dificil: { vel: VEL_PALA_MOV*0.95, error: 8,  nombre:'Difícil' }
};
let cpuObjetivoY = 0, cpuTimerRecalculo = 0;
 
let CONFIG = { meta:7, velocidad:'normal', superActivo:true, tamPala:'normal', dificultad:'normal' };
function PALA_ALTURA(){ return CONFIG.tamPala==='pequena'?76:(CONFIG.tamPala==='grande'?130:100); }
function VEL_BASE(){ return CONFIG.velocidad==='lenta'?4.6:(CONFIG.velocidad==='rapida'?8.4:6.2); }
 
let estado = 'menu';
let modo = null;
let scoreEsp = 0, scoreArg = 0;
let peer = null, conn = null;
let remoteInputDx = 0, remoteInputDy = 0;
 
// --- sistema de carga / supertiro ---
let chargeEsp = 0, chargeArg = 0;       // toques acumulados (0..TOQUES_PARA_CARGA)
let readyEsp = false, readyArg = false; // barra llena, esperando activación
let armedEsp = false, armedArg = false; // espacio pulsado, listo para disparar en el próximo golpe
let orbitando = { activo:false };       // estado de la animación de órbita antes del disparo
 
let efectoSuper = { activo:false, lado:null, inicio:0, equipo:null };
let efectoContador = 0, efectoVisto = 0;
 
let equipoEsp = TEAMS.find(t=>t.id==='esp');
let equipoArg = TEAMS.find(t=>t.id==='arg');
 
let palaEsp = { x: 30, y: H/2 - 50 };
let palaArg = { x: W-30-PALA_W, y: H/2 - 50 };
let bola = { x: W/2, y: H/2, vx: 0, vy: 0, r: BOLA_R, giro:0 };
 
// --- ambiente: motas de polvo/papel flotando en la cancha ---
const PAPEL_TINTA = '#1A1712';
const PAPEL_CREMA = '#F2E8D5';
const PAPEL_OCRE = '#D9A441';
let particulas = [];
for(let i=0;i<26;i++){
  particulas.push({
    x: Math.random()*W, y: Math.random()*H,
    r: 1 + Math.random()*2, fase: Math.random()*Math.PI*2,
    vel: 0.15 + Math.random()*0.3
  });
}
let anguloSunburst = 0;
 
// --- confeti de papel al marcar gol ---
let confeti = [];
function celebrarGol(colores){
  for(let i=0;i<26;i++){
    confeti.push({
      x: W/2 + (Math.random()*60-30), y: H*0.15 + Math.random()*30,
      vx: (Math.random()*4-2), vy: 1 + Math.random()*2.5,
      w: 5+Math.random()*4, h: 3+Math.random()*3,
      rot: Math.random()*Math.PI, vrot:(Math.random()*.3-.15),
      color: colores[Math.floor(Math.random()*colores.length)],
      vida: 90
    });
  }
}
 
function limitesEsp(){ return { xMin:14, xMax: W/2 - MARGEN_CENTRO - PALA_W, yMin:14, yMax: H-14-PALA_ALTURA() }; }
function limitesArg(){ return { xMin: W/2 + MARGEN_CENTRO, xMax: W-14-PALA_W, yMin:14, yMax: H-14-PALA_ALTURA() }; }
 
const teclas = {};
window.addEventListener('keydown', e=>{
  teclas[e.key] = true;
 
  if(e.key === ' '){
    e.preventDefault();
    if(estado === 'jugando'){
      if(modo === 'local'){
        if(readyEsp && !armedEsp) armedEsp = true;
        if(readyArg && !armedArg) armedArg = true;
      } else if(modo === 'host' || modo === 'cpu'){
        if(readyEsp && !armedEsp) armedEsp = true;
      } else if(modo === 'guest'){
        if(conn && conn.open) conn.send({ t:'espacio' });
      }
    }
  }
 
  if(e.key === 'Escape' || e.key === 'p' || e.key === 'P'){
    e.preventDefault();
    if(estado === 'jugando' && (modo === 'local' || modo === 'host' || modo === 'cpu')){
      estado = 'pausa'; mostrarVista('pausa');
      if(conn && conn.open) conn.send(estadoRed());
    } else if(estado === 'pausa' && (modo === 'local' || modo === 'host' || modo === 'cpu')){
      estado = 'jugando'; ocultarOverlay();
      if(conn && conn.open) conn.send(estadoRed());
    }
  }
 
  if(modo === 'guest') enviarInputGuest();
});
window.addEventListener('keyup', e=>{
  teclas[e.key] = false;
  if(modo === 'guest') enviarInputGuest();
});
 
function ocultarOverlay(){ overlay.classList.add('oculto'); }
function mostrarOverlayVisible(){ overlay.classList.remove('oculto'); }
 
function actualizarMarcador(){ scoreEspEl.textContent = scoreEsp; scoreArgEl.textContent = scoreArg; }
 
function actualizarBarras(){
  barraEspEl.style.width = (chargeEsp/TOQUES_PARA_CARGA*100) + '%';
  barraArgEl.style.width = (chargeArg/TOQUES_PARA_CARGA*100) + '%';
  barraEspEl.classList.toggle('lista', readyEsp);
  barraArgEl.classList.toggle('lista', readyArg);
}
 
function actualizarTitulo(){
  tituloEl.innerHTML = `<span class="bandera-emoji-titulo">${banderaEmoji(equipoEsp.cc)}</span><span style="color:${equipoEsp.colores[0]}">${equipoEsp.nombre.toUpperCase()}</span> &nbsp;vs&nbsp; <span style="color:${equipoArg.colores[0]}">${equipoArg.nombre.toUpperCase()}</span><span class="bandera-emoji-titulo">${banderaEmoji(equipoArg.cc)}</span>`;
  nombreEspEl.innerHTML = `<span class="bandera-emoji-marcador">${banderaEmoji(equipoEsp.cc)}</span>${equipoEsp.nombre}`;
  nombreArgEl.innerHTML = `<span class="bandera-emoji-marcador">${banderaEmoji(equipoArg.cc)}</span>${equipoArg.nombre}`;
  numEspEl.style.color = equipoEsp.colores[0];
  numArgEl.style.color = equipoArg.colores[0];
  document.getElementById('vs').firstChild.textContent = 'FT. ' + CONFIG.meta;
}
 
function mostrarTituloNeutro(){
  tituloEl.textContent = 'PONG OFICIAL DE EVENTOS';
  nombreEspEl.textContent = 'EQUIPO A';
  nombreArgEl.textContent = 'EQUIPO B';
  numEspEl.style.color = '';
  numArgEl.style.color = '';
}
 
function actualizarPie(){
  const suf = ' · WASD';
  if(modo === 'local'){
    pieEsp.textContent = equipoEsp.nombre.toUpperCase() + suf;
    pieArg.textContent = equipoArg.nombre.toUpperCase() + ' · FLECHAS';
    pieCentro.textContent = 'ESPACIO = supertiro (con carga) · ESC pausa';
  } else if(modo === 'host'){
    pieEsp.textContent = 'VOS: ' + equipoEsp.nombre.toUpperCase() + suf;
    pieArg.textContent = 'RIVAL: ' + equipoArg.nombre.toUpperCase() + ' (remoto)';
    pieCentro.textContent = 'ESPACIO = tu supertiro · ESC pausa';
  } else if(modo === 'guest'){
    pieEsp.textContent = 'RIVAL: ' + equipoEsp.nombre.toUpperCase() + ' (remoto)';
    pieArg.textContent = 'VOS: ' + equipoArg.nombre.toUpperCase() + suf;
    pieCentro.textContent = 'ESPACIO = tu supertiro · el anfitrión controla la pausa';

  }
}

function pedirEquipo(lado, callback){ mostrarVista('elegir-equipo', { lado, callback }); }
 
function limpiarConexion(){
  if(conn){ try{ conn.close(); }catch(e){} conn = null; }
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  estadoConexionEl.textContent = '';
}
 
function reiniciarCargas(){
  chargeEsp = 0; chargeArg = 0;
  readyEsp = false; readyArg = false;
  armedEsp = false; armedArg = false;
  orbitando = { activo:false };
  actualizarBarras();
}
 
function volverAlMenu(){
  limpiarConexion();
  modo = null; estado = 'menu';
  scoreEsp = 0; scoreArg = 0; actualizarMarcador();
  reiniciarCargas();
  pieEsp.textContent = ''; pieArg.textContent = ''; pieCentro.textContent = '';
  mostrarTituloNeutro();
  mostrarVista('menu');
}
 
function generarCodigo(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
 
function crearPartidaOnline(intentos){
  intentos = intentos || 0;
  modo = 'host';
  mostrarVista('generando');
  const codigo = generarCodigo();
  peer = new Peer('clasico-' + codigo, { debug: 0 });
 
  peer.on('open', ()=>{
    mostrarVista('esperando', { codigo });
    peer.on('connection', c=>{
      conn = c;
      conn.on('open', ()=>{ estadoConexionEl.textContent = 'Conectado'; });
      conn.on('data', data=>{
        if(data.t === 'equipoGuest'){
          equipoArg = TEAMS.find(t=>t.id === data.id) || equipoArg;
          actualizarTitulo(); actualizarPie();
          conn.send({ t:'config', config:CONFIG, equipoEspId:equipoEsp.id, equipoArgId:equipoArg.id });
          arrancarCuentaAtras();
        } else if(data.t === 'input'){
          remoteInputDx = data.dx; remoteInputDy = data.dy;
        } else if(data.t === 'espacio'){
          if(readyArg && !armedArg) armedArg = true;
        }
      });
      conn.on('close', ()=> manejarDesconexion());
    });
  });
 
  peer.on('error', err=>{
    if(err.type === 'unavailable-id' && intentos < 5) crearPartidaOnline(intentos+1);
    else mostrarVista('error', { msg: 'No se pudo crear la sala. Probá de nuevo.' });
  });
}
 
function conectarComoGuest(codigo){
  modo = 'guest';
  mostrarVista('conectando', { codigo });
  peer = new Peer();
  peer.on('open', ()=>{
    conn = peer.connect('clasico-' + codigo, { reliable:true });
    conn.on('open', ()=>{
      estadoConexionEl.textContent = 'Conectado';
      conn.send({ t:'equipoGuest', id: equipoArg.id });
    });
    conn.on('data', data=>{
      if(data.t === 'config'){
        CONFIG = data.config;
        equipoEsp = TEAMS.find(t=>t.id === data.equipoEspId) || equipoEsp;
        equipoArg = TEAMS.find(t=>t.id === data.equipoArgId) || equipoArg;
        actualizarTitulo(); actualizarPie();
        arrancarCuentaAtras();
      } else {
        aplicarEstadoRemoto(data);
      }
    });
    conn.on('close', ()=> manejarDesconexion());
    conn.on('error', ()=> mostrarVista('error', { msg: 'Se perdió la conexión con la sala.' }));
  });
  peer.on('error', err=>{
    if(err.type === 'peer-unavailable') mostrarVista('error', { msg: 'Ese código no existe o la partida ya cerró.' });
    else mostrarVista('error', { msg: 'No se pudo conectar. Revisá el código e intentá otra vez.' });
  });
}
 
function manejarDesconexion(){
  if(estado === 'menu') return;
  estado = 'pausa';
  estadoConexionEl.textContent = 'Desconectado';
  mostrarVista('error', { msg: 'Tu rival se desconectó de la partida.' });
}
 
function posicionInicialPalas(){
  const ph = PALA_ALTURA();
  palaEsp = { x: 30, y: H/2 - ph/2 };
  palaArg = { x: W-30-PALA_W, y: H/2 - ph/2 };
}
 
function arrancarCuentaAtras(){
  mostrarVista('cuenta-atras');
  scoreEsp = 0; scoreArg = 0; actualizarMarcador();
  reiniciarCargas();
  posicionInicialPalas();
  let n = 3;
  const txt = document.getElementById('cuentaTxt');
  const iv = setInterval(()=>{
    n--;
    if(n > 0){ txt.textContent = 'Arranca en ' + n + '…'; }
    else {
      clearInterval(iv);
      ocultarOverlay();
      estado = 'jugando';
      if(modo === 'host'){ centrarBola(Math.random()>0.5?1:-1); }
    }
  }, 800);
}
 
function iniciarPartido(){
  scoreEsp = 0; scoreArg = 0; actualizarMarcador();
  reiniciarCargas();
  posicionInicialPalas();
  estado = 'jugando';
  ocultarOverlay();
  centrarBola(Math.random() > 0.5 ? 1 : -1);
}
 
function centrarBola(direccion){
  bola.x = W/2; bola.y = H/2 + (Math.random()*160 - 80);
  const velBase = VEL_BASE();
  const angulo = (Math.random()*0.7 - 0.35);
  bola.vx = velBase * direccion;
  bola.vy = velBase * angulo * 2;
}
 
function enviarInputGuest(){
  if(!conn || !conn.open) return;
  let dx = 0, dy = 0;
  if(teclas['w'] || teclas['W'] || teclas['ArrowUp']) dy -= 1;
  if(teclas['s'] || teclas['S'] || teclas['ArrowDown']) dy += 1;
  if(teclas['a'] || teclas['A'] || teclas['ArrowLeft']) dx -= 1;
  if(teclas['d'] || teclas['D'] || teclas['ArrowRight']) dx += 1;
  conn.send({ t:'input', dx, dy });
}
 
function estadoRed(){
  return {
    t:'state',
    bx: bola.x, by: bola.y,
    pex: palaEsp.x, pey: palaEsp.y, pax: palaArg.x, pay: palaArg.y,
    se: scoreEsp, sa: scoreArg, st: estado,
    ef: efectoContador, efLado: efectoSuper.lado,
    ce: chargeEsp, ca: chargeArg, re: readyEsp, ra: readyArg
  };
}
 
function aplicarEstadoRemoto(data){
  if(data.t !== 'state') return;
  bola.x = data.bx; bola.y = data.by;
  palaEsp.x = data.pex; palaEsp.y = data.pey;
  palaArg.x = data.pax; palaArg.y = data.pay;
  chargeEsp = data.ce; chargeArg = data.ca; readyEsp = data.re; readyArg = data.ra;
  actualizarBarras();
  if(data.se !== scoreEsp || data.sa !== scoreArg){
    if(data.se > scoreEsp) celebrarGol(equipoEsp.colores);
    if(data.sa > scoreArg) celebrarGol(equipoArg.colores);
    scoreEsp = data.se; scoreArg = data.sa; actualizarMarcador();
  }
  if(data.ef !== efectoVisto){
    efectoVisto = data.ef;
    dispararEfectoSuper(data.efLado);
  }
  if(data.st === 'pausa' && estado !== 'pausa'){ estado = 'pausa'; mostrarVista('pausa'); }
  else if(data.st === 'jugando' && estado === 'pausa'){ estado = 'jugando'; ocultarOverlay(); }
  else if(data.st === 'fin' && estado !== 'fin'){
    estado = 'fin';
    const ganaEsp = scoreEsp >= CONFIG.meta;
    mostrarVista('fin', {
      titulo: `¡${(ganaEsp?equipoEsp:equipoArg).nombre.toUpperCase()} CAMPEÓN!`,
      texto: `${scoreEsp} - ${scoreArg}`,
      revancha: false
    });
  }
}
 
function moverCPU(){
  const p = DIFICULTADES_CPU[CONFIG.dificultad] || DIFICULTADES_CPU.normal;
  const ph = PALA_ALTURA();
  cpuTimerRecalculo--;
  if(cpuTimerRecalculo <= 0){
    cpuTimerRecalculo = 10; // recalcula cada ~0.16s, así no apunta como un aimbot
    if(bola.vx > 0){
      cpuObjetivoY = bola.y + (Math.random()*2-1)*p.error;
    } else {
      cpuObjetivoY = H/2; // sin amenaza, vuelve al centro de su zona
    }
  }
  const centroActual = palaArg.y + ph/2;
  const diferencia = cpuObjetivoY - centroActual;
  if(Math.abs(diferencia) > 4){
    palaArg.y += Math.sign(diferencia) * Math.min(Math.abs(diferencia), p.vel);
  }
  // la CPU no puede "pulsar espacio": dispara su supertiro en cuanto está lista
  if(readyArg && !armedArg) armedArg = true;
}
 
function dispararEfectoSuper(lado){
  efectoSuper = { activo:true, lado, inicio: performance.now(), equipo: lado==='esp'?equipoEsp:equipoArg };
}
 
// ---- carga / activación del supertiro ----
function registrarGolpe(lado){
  if(lado === 'esp'){
    if(readyEsp) return;
    chargeEsp = Math.min(chargeEsp+1, TOQUES_PARA_CARGA);
    if(chargeEsp >= TOQUES_PARA_CARGA) readyEsp = true;
  } else {
    if(readyArg) return;
    chargeArg = Math.min(chargeArg+1, TOQUES_PARA_CARGA);
    if(chargeArg >= TOQUES_PARA_CARGA) readyArg = true;
  }
  actualizarBarras();
}
 
function consumirCarga(lado){
  if(lado === 'esp'){ chargeEsp = 0; readyEsp = false; armedEsp = false; }
  else { chargeArg = 0; readyArg = false; armedArg = false; }
  actualizarBarras();
}
 
function iniciarOrbita(pala, lado){
  orbitando = {
    activo:true,
    lado,
    pala,
    angulo: 0,
    frame: 0,
    duracion: 50, // ~0.83s a 60fps
    radio: 36,
    equipo: lado==='esp'?equipoEsp:equipoArg
  };
  efectoContador++;
  dispararEfectoSuper(lado);
}
 
function lanzarSupertiro(lado){
  const pala = lado === 'esp' ? palaEsp : palaArg;
  const dirBase = lado === 'esp' ? 1 : -1;
  const velocidad = 40; // supertiro más veloz que antes
 
  // dirección con ángulo aleatorio: ya no depende de dónde estaba la pala,
  // así el rival no puede anticipar hacia dónde va a salir
  const angulo = (Math.random()*2 - 1) * 0.85; // hasta ~49° arriba o abajo, al azar
  bola.vx = dirBase*velocidad*Math.cos(angulo);
  bola.vy = velocidad*Math.sin(angulo);
  bola.x = pala.x + (lado==='esp' ? PALA_W+bola.r+3 : -(bola.r+3));
}
 
function actualizar(){
  anguloSunburst += 0.0025;
 
  // ambiente: motas de polvo siempre en marcha, aunque estemos en menú
  particulas.forEach(p=>{
    p.fase += p.vel*0.02;
    p.y -= p.vel*0.3;
    p.x += Math.sin(p.fase)*0.3;
    if(p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
  });
 
  // confeti activo tras un gol
  confeti.forEach(c=>{
    c.x += c.vx; c.y += c.vy; c.vy += 0.05; c.rot += c.vrot; c.vida--;
  });
  confeti = confeti.filter(c=> c.vida > 0);
 
  if(estado !== 'jugando') return;
  if(modo === 'guest') return;
 
  const lEsp = limitesEsp(), lArg = limitesArg();
 
  if(modo === 'local'){
    if(teclas['w'] || teclas['W']) palaEsp.y -= VEL_PALA_MOV;
    if(teclas['s'] || teclas['S']) palaEsp.y += VEL_PALA_MOV;
    if(teclas['a'] || teclas['A']) palaEsp.x -= VEL_PALA_MOV;
    if(teclas['d'] || teclas['D']) palaEsp.x += VEL_PALA_MOV;
    if(teclas['ArrowUp']) palaArg.y -= VEL_PALA_MOV;
    if(teclas['ArrowDown']) palaArg.y += VEL_PALA_MOV;
    if(teclas['ArrowLeft']) palaArg.x -= VEL_PALA_MOV;
    if(teclas['ArrowRight']) palaArg.x += VEL_PALA_MOV;
  } else if(modo === 'cpu'){
    if(teclas['w'] || teclas['W']) palaEsp.y -= VEL_PALA_MOV;
    if(teclas['s'] || teclas['S']) palaEsp.y += VEL_PALA_MOV;
    if(teclas['a'] || teclas['A']) palaEsp.x -= VEL_PALA_MOV;
    if(teclas['d'] || teclas['D']) palaEsp.x += VEL_PALA_MOV;
    moverCPU();
  } else if(modo === 'host'){
    if(teclas['w'] || teclas['W']) palaEsp.y -= VEL_PALA_MOV;
    if(teclas['s'] || teclas['S']) palaEsp.y += VEL_PALA_MOV;
    if(teclas['a'] || teclas['A']) palaEsp.x -= VEL_PALA_MOV;
    if(teclas['d'] || teclas['D']) palaEsp.x += VEL_PALA_MOV;
    palaArg.x += remoteInputDx * VEL_PALA_MOV;
    palaArg.y += remoteInputDy * VEL_PALA_MOV;
  }
 
  palaEsp.x = Math.max(lEsp.xMin, Math.min(lEsp.xMax, palaEsp.x));
  palaEsp.y = Math.max(lEsp.yMin, Math.min(lEsp.yMax, palaEsp.y));
  palaArg.x = Math.max(lArg.xMin, Math.min(lArg.xMax, palaArg.x));
  palaArg.y = Math.max(lArg.yMin, Math.min(lArg.yMax, palaArg.y));
 
  // --- animación de órbita del supertiro: la bola gira alrededor de la pala antes de salir disparada ---
  if(orbitando.activo){
    orbitando.frame++;
    orbitando.angulo += 0.38;
    const ph = PALA_ALTURA();
    const signoLado = orbitando.lado === 'esp' ? 1 : -1;
    const centroX = orbitando.pala.x + PALA_W/2 + signoLado*orbitando.radio*0.75;
    const centroY = orbitando.pala.y + ph/2;
    bola.x = centroX + Math.cos(orbitando.angulo)*orbitando.radio;
    bola.y = centroY + Math.sin(orbitando.angulo)*orbitando.radio*0.7;
    bola.giro += 0.45;
 
    if(orbitando.frame >= orbitando.duracion){
      lanzarSupertiro(orbitando.lado);
      orbitando.activo = false;
    }
 
    if(modo === 'host' && conn && conn.open) conn.send(estadoRed());
    return;
  }
 
  bola.x += bola.vx; bola.y += bola.vy; bola.giro += 0.12;
 
  if(bola.y - bola.r < 10){ bola.y = 10 + bola.r; bola.vy *= -1; }
  if(bola.y + bola.r > H - 10){ bola.y = H - 10 - bola.r; bola.vy *= -1; }
 
  if(bola.vx < 0 && colisionaConPala(palaEsp)){ respuestaColision(palaEsp, 'esp'); }
  if(bola.vx > 0 && colisionaConPala(palaArg)){ respuestaColision(palaArg, 'arg'); }
 
  if(bola.x < -30){
    scoreArg++; actualizarMarcador(); celebrarGol(equipoArg.colores); if(!comprobarFin()) centrarBola(1);
  } else if(bola.x > W + 30){
    scoreEsp++; actualizarMarcador(); celebrarGol(equipoEsp.colores); if(!comprobarFin()) centrarBola(-1);
  }
 
  if(modo === 'host' && conn && conn.open) conn.send(estadoRed());
}
 
function colisionaConPala(pala){
  const ph = PALA_ALTURA();
  const cercaX = Math.max(pala.x, Math.min(bola.x, pala.x + PALA_W));
  const cercaY = Math.max(pala.y, Math.min(bola.y, pala.y + ph));
  const dx = bola.x - cercaX, dy = bola.y - cercaY;
  return (dx*dx + dy*dy) <= bola.r*bola.r;
}
 
function respuestaColision(pala, ladoQueGolpea){
  const armado = (ladoQueGolpea === 'esp' && armedEsp) || (ladoQueGolpea === 'arg' && armedArg);
 
  if(armado && CONFIG.superActivo){
    consumirCarga(ladoQueGolpea);
    iniciarOrbita(pala, ladoQueGolpea);
    return;
  }
 
  const ph = PALA_ALTURA();
  const cercaX = Math.max(pala.x, Math.min(bola.x, pala.x + PALA_W));
  const cercaY = Math.max(pala.y, Math.min(bola.y, pala.y + ph));
  let dx = bola.x - cercaX, dy = bola.y - cercaY;
  let dist = Math.hypot(dx, dy);
  if(dist === 0){ dx = (ladoQueGolpea==='esp') ? 1 : -1; dy = 0; dist = 1; }
  const nx = dx/dist, ny = dy/dist;
 
  registrarGolpe(ladoQueGolpea);
 
  // el aumento de velocidad en cada toque ahora es mucho más gradual,
  // y el techo máximo está atado a la velocidad configurada (lenta/normal/rápida)
  let velocidad = Math.min(Math.hypot(bola.vx, bola.vy) * 1.018, VEL_BASE() * 2.1);
 
  const offsetVertical = (bola.y - (pala.y + ph/2)) / (ph/2);
  const dirBase = ladoQueGolpea === 'esp' ? 1 : -1;
  let vx = Math.abs(nx*velocidad + dirBase*velocidad*0.4) * dirBase;
  let vy = ny*velocidad*0.5 + offsetVertical*velocidad*0.7;
 
  // la descomposición de arriba (por ángulo de impacto y toque) puede dar una
  // rapidez resultante mayor que "velocidad" — se renormaliza el vector para
  // que la magnitud final sea exactamente la calculada, y así el incremento
  // real por toque coincida con el multiplicador suave de arriba
  const magnitudResultante = Math.hypot(vx, vy) || velocidad;
  const factorNormalizacion = velocidad / magnitudResultante;
  vx *= factorNormalizacion;
  vy *= factorNormalizacion;
 
  bola.vx = vx; bola.vy = vy;
  bola.x = cercaX + nx*(bola.r+1);
  bola.y = cercaY + ny*(bola.r+1);
}
 
function comprobarFin(){
  if(scoreEsp >= CONFIG.meta || scoreArg >= CONFIG.meta){
    estado = 'fin';
    const ganaEsp = scoreEsp >= CONFIG.meta;
    mostrarVista('fin', {
      titulo: `¡${(ganaEsp?equipoEsp:equipoArg).nombre.toUpperCase()} CAMPEÓN!`,
      texto: `${scoreEsp} - ${scoreArg}`,
      revancha: (modo === 'local' || modo === 'cpu')
    });
    if(modo === 'host' && conn && conn.open) conn.send(estadoRed());
    return true;
  }
  return false;
}
 
function dibujarFondoCancha(){
  // papel/verde de fondo con degradado sutil
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#33553A');
  grad.addColorStop(1, PAPEL_TINTA_VERDE());
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
 
  // textura halftone: puntos suaves repartidos
  ctx.save();
  ctx.globalAlpha = .05;
  ctx.fillStyle = PAPEL_CREMA;
  const paso = 14;
  for(let y=paso/2; y<H; y+=paso){
    for(let x=(((y/paso)|0)%2===0?paso/2:paso); x<W; x+=paso){
      ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
 
  // viñeta tipo cartel envejecido
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}
function PAPEL_TINTA_VERDE(){ return '#1D3423'; }
 
function dibujarParticulas(){
  ctx.save();
  particulas.forEach(p=>{
    ctx.globalAlpha = 0.10 + 0.05*Math.sin(p.fase);
    ctx.fillStyle = PAPEL_CREMA;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}
 
function dibujarSunburstCentro(){
  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.rotate(anguloSunburst);
  const radios = 82;
  const rayos = 22;
  for(let i=0;i<rayos;i++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    const a0 = (Math.PI*2/rayos)*i;
    const a1 = a0 + (Math.PI*2/rayos)*0.5;
    ctx.arc(0,0,radios,a0,a1);
    ctx.closePath();
    ctx.fillStyle = i%2===0 ? 'rgba(217,164,65,.14)' : 'rgba(217,164,65,.05)';
    ctx.fill();
  }
  ctx.restore();
 
  ctx.beginPath(); ctx.arc(W/2,H/2,72,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(242,232,213,0.16)'; ctx.lineWidth = 2; ctx.stroke();
}
 
function dibujarCancha(){
  ctx.clearRect(0,0,W,H);
  dibujarFondoCancha();
  dibujarParticulas();
 
  ctx.strokeStyle = 'rgba(242,232,213,0.22)';
  ctx.lineWidth = 3;
  ctx.strokeRect(10,10,W-20,H-20);
 
  ctx.setLineDash([14,14]);
  ctx.beginPath(); ctx.moveTo(W/2, 10); ctx.lineTo(W/2, H-10);
  ctx.strokeStyle = 'rgba(242,232,213,0.16)'; ctx.stroke();
  ctx.setLineDash([]);
 
  dibujarSunburstCentro();
 
  dibujarPala(palaEsp, equipoEsp.colores, equipoEsp.cc);
  dibujarPala(palaArg, equipoArg.colores, equipoArg.cc);
  dibujarBola();
  dibujarConfeti();
 
  if(efectoSuper.activo){
    const t = performance.now() - efectoSuper.inicio;
    if(t > 1000){ efectoSuper.activo = false; }
    else {
      const progreso = Math.min(t/160,1);
      const escala = 1.5 - 0.5*progreso;
      ctx.save();
      ctx.translate(W/2, 56);
      ctx.rotate(-0.05);
      ctx.scale(escala, escala);
      ctx.globalAlpha = t < 800 ? 1 : 1 - (t-800)/200;
 
      const texto = '¡SUPERTIRO ' + efectoSuper.equipo.nombre.toUpperCase() + '!';
      ctx.font = "bold 30px 'Anton', sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const metrica = ctx.measureText(texto);
      const padX = 22, padY = 14;
 
      ctx.strokeStyle = efectoSuper.equipo.colores[0];
      ctx.lineWidth = 4;
      ctx.strokeRect(-metrica.width/2-padX, -18-padY, metrica.width+padX*2, 36+padY*2);
 
      ctx.fillStyle = efectoSuper.equipo.colores[0];
      ctx.fillText(texto, 1, 1);
      ctx.fillStyle = PAPEL_CREMA;
      ctx.fillText(texto, 0, 0);
      ctx.restore();
    }
  }
}
 
function dibujarConfeti(){
  confeti.forEach(c=>{
    ctx.save();
    ctx.globalAlpha = Math.max(c.vida/90, 0);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  });
}
 
function dibujarPala(pala, colores, cc){
  const ph = PALA_ALTURA();
  const franja = ph/3;
  ctx.save();
  ctx.shadowColor = 'rgba(26,23,18,.35)'; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
  ctx.fillStyle = colores[0]; ctx.fillRect(pala.x, pala.y, PALA_W, franja);
  ctx.fillStyle = colores[1]; ctx.fillRect(pala.x, pala.y+franja, PALA_W, franja);
  ctx.fillStyle = colores[0]; ctx.fillRect(pala.x, pala.y+franja*2, PALA_W, franja);
  ctx.restore();
 
  // parche con la bandera real del país (emoji), para que la pala se reconozca de un vistazo
  if(cc){
    ctx.save();
    ctx.font = (PALA_W*1.7) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(banderaEmoji(cc), pala.x+PALA_W/2, pala.y+ph/2);
    ctx.restore();
  }
 
  ctx.strokeStyle = PAPEL_TINTA; ctx.lineWidth = 2; ctx.strokeRect(pala.x, pala.y, PALA_W, ph);
}
 
// dibuja un pentágono relleno, usado para simular los parches de un balón de fútbol clásico
function dibujarPentagono(cx, cy, r, color, rotBase){
  rotBase = rotBase || 0;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a = rotBase + (Math.PI*2/5)*i - Math.PI/2;
    const x = cx + Math.cos(a)*r;
    const y = cy + Math.sin(a)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
 
function dibujarBola(){
  ctx.save();
  ctx.translate(bola.x, bola.y);
  ctx.rotate(bola.giro);
 
  // base del balón, tipo balón de fútbol clásico blanco/crema con parches negros
  ctx.beginPath(); ctx.arc(0,0,bola.r,0,Math.PI*2);
  ctx.fillStyle = PAPEL_CREMA;
  ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = PAPEL_TINTA; ctx.stroke();
 
  dibujarPentagono(0, 0, bola.r*0.42, PAPEL_TINTA);
 
  const n = 5;
  for(let i=0;i<n;i++){
    const ang = (Math.PI*2/n)*i + Math.PI/2;
    const px = Math.cos(ang)*bola.r*0.7;
    const py = Math.sin(ang)*bola.r*0.7;
    dibujarPentagono(px, py, bola.r*0.30, PAPEL_TINTA, ang);
  }
 
  ctx.strokeStyle = 'rgba(26,23,18,.35)'; ctx.lineWidth = 1;
  for(let i=0;i<n;i++){
    const ang = (Math.PI*2/n)*i + Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(ang)*bola.r*0.95, Math.sin(ang)*bola.r*0.95);
    ctx.stroke();
  }
  ctx.restore();
 
  // aro de color mientras la bola está en la órbita del supertiro
  if(orbitando.activo){
    ctx.save();
    ctx.beginPath();
    ctx.arc(bola.x, bola.y, bola.r+4, 0, Math.PI*2);
    ctx.strokeStyle = orbitando.equipo.colores[0];
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.85;
    ctx.stroke();
    ctx.restore();
  }
}
 
function bucle(){ actualizar(); dibujarCancha(); requestAnimationFrame(bucle); }
 
mostrarTituloNeutro();
actualizarBarras();
mostrarVista('menu');
bucle();
</script>
